[project]
name = "pydicomrt"
version = "0.9.1"
description = "DICOM RT Structure and Registration"
readme = "README.md"
authors = [
    { name = "Higumalu", email = "higuma.lu@gmail.com" }
]
# ct/builder.py uses structural pattern matching (`match`), which needs 3.10.
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    # 3.0 is a real floor, not a preference: the builders rely on save_as() taking the
    # encoding from file_meta, where pydicom 2 required the is_little_endian /
    # is_implicit_VR attributes that pydicom 4 removes.
    "pydicom>=3.0.0",
    "numpy>=1.26.4",
    "opencv-python>=4.10.0",
    "scipy>=1.10.3",
    "simpleitk>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
# demons_registration(backend="torch"). Kept out of the core dependencies on purpose: PyTorch
# is a multi-gigabyte install, and the default SimpleITK backend does not need it. Install a
# CUDA build of torch for GPU acceleration; the default PyPI wheel may be CPU-only on some
# platforms.
gpu = [
    "torch>=2.1",
]

[project.scripts]
pydicomrt = "pydicomrt:main"

# scikit-build-core, because the package carries a small C++ library (csrc/rigid_core.cpp, the core
# of rigid_registration's default algorithm). It is loaded through ctypes rather than built as a
# Python extension, so wheels are py3-none-<platform>: one per platform, not per Python version.
# CMakeLists.txt treats the compiler as optional; see the note there.
[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/pydicomrt"]
wheel.py-api = "py3"
cmake.build-type = "Release"

# Wheels: .github/workflows/wheels.yml. The library has no Python ABI, so one build per platform
# (any one Python) yields a py3-none wheel for all of them. A missing compiler fails the build
# rather than shipping a numpy-only wheel, and the test proves the library loads and agrees with
# the numpy implementation.
[tool.cibuildwheel]
build = "cp311-*"
skip = "*-musllinux_*"  # SimpleITK and opencv publish no musllinux wheels to test against
archs = ["native"]
config-settings = { "cmake.define.PYDICOMRT_REQUIRE_CORE" = "ON" }
test-requires = ["pytest"]
test-sources = ["test", "pyproject.toml"]
test-command = "python -c \"import pydicomrt.reg.method._rigid_core\" && pytest -q test/reg/test_rigid_stochastic.py"

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py"]
# Real-data tests run full registrations on clinical volumes and take minutes; they are
# excluded by default. Run them with `pytest -m slow`.
addopts = "-m 'not slow'"
markers = [
    "slow: full-size registration against real clinical data (opt in with -m slow)",
]
